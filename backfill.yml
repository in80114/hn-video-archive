name: Backfill HN history (resumable)
on:
  workflow_dispatch:
  schedule:
    - cron: '11 3 2 * *'
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python scripts/index_hn.py --mode backfill --max-windows 24
      - name: Save progress
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Backfill HN historical index'
            git push
          fi
