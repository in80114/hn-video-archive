<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HN Video Archive</title><style>:root{font-family:Inter,system-ui,'Noto Sans TC',sans-serif;color:#f2f2f2;background:#0f0f0f}*{box-sizing:border-box}body{margin:0}header{height:68px;display:flex;align-items:center;gap:24px;padding:0 28px;border-bottom:1px solid #292929;position:sticky;top:0;background:#0f0f0fee;backdrop-filter:blur(10px);z-index:2}.brand{font-size:21px;font-weight:800;white-space:nowrap}.brand b{background:#ff6600;color:white;padding:5px 9px;border-radius:8px;margin-right:8px}.search{width:min(600px,100%);margin:auto;background:#202020;color:white;border:1px solid #444;border-radius:25px;padding:13px 20px;font-size:15px}main{max-width:1450px;margin:auto;padding:30px 30px 60px}.intro h1{font-size:34px;margin:10px 0}.intro p{color:#aaa;line-height:1.6}.chips{display:flex;gap:9px;flex-wrap:wrap;margin:25px 0}.chip{background:#292929;border:0;border-radius:10px;padding:11px 17px;color:#eee;cursor:pointer}.chip.active{background:#f1f1f1;color:#111}select{background:#222;color:white;border:1px solid #444;padding:8px;border-radius:8px}.meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;color:#aaa;font-size:13px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:30px 18px}.card{cursor:pointer}.thumb{aspect-ratio:16/9;border-radius:12px;background:linear-gradient(130deg,#292929,#1b1b1b);position:relative;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.duration{position:absolute;bottom:9px;right:9px;background:#000c;padding:4px 6px;border-radius:4px;font-size:12px}.card h3{font-size:15px;line-height:1.4;margin:12px 0 5px}.small{font-size:12px;color:#aaa;line-height:1.6}.tag{display:inline-block;color:#ff944d;margin-top:4px}.empty{padding:70px 20px;text-align:center;color:#aaa}.status{color:#ffae75}.modal{position:fixed;inset:0;background:#000d;z-index:5;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{width:min(960px,100%);background:#1b1b1b;border-radius:14px;padding:20px;max-height:95vh;overflow:auto}.player{aspect-ratio:16/9;background:black}.player iframe{width:100%;height:100%;border:0}.actions{display:flex;justify-content:space-between;gap:12px;align-items:center}.close{border:0;background:#333;color:white;padding:9px 14px;border-radius:7px;cursor:pointer}a{color:#ff995c}footer{color:#888;font-size:12px;line-height:1.7;margin-top:50px;border-top:1px solid #333;padding-top:20px}@media(max-width:600px){header{padding:12px;gap:10px;flex-wrap:wrap;height:auto}.brand{font-size:17px}.search{order:2;flex-basis:100%}main{padding:20px 14px}.intro h1{font-size:27px}}</style></head><body><header><div class="brand"><b>Y</b>HN Video Archive</div><input id="search" class="search" placeholder="搜尋 HN 影片、創作者或主題…" aria-label="搜尋影片"></header><main><section class="intro"><h1>Hacker News 反覆推薦的經典影片</h1><p>探索多年來被 Hacker News 社群重複分享的 YouTube 影片。網站讀取預先建立的歷史索引，以 YouTube 影片 ID 去重，並依不同 HN 貼文數量排序。</p></section><div id="chips" class="chips"></div><div class="meta"><span id="count">正在載入影片索引…</span><label>排序：<select id="sort" aria-label="排序方式"><option value="count">推薦次數</option><option value="points">HN 累計分數</option><option value="recent">最近推薦</option></select></label><span class="status" id="status"></span></div><div class="grid" id="grid"></div><footer>資料範圍：HN story 貼文的外部 YouTube URL；不含留言中的連結、文字內嵌連結或其他影片平台。歷史回填完成前，排行榜並不完整。「重複推薦」指不同 HN 貼文連到相同影片 ID，不代表不同使用者。影片縮圖來自 YouTube，播放由 YouTube 提供。</footer></main><div class="modal" id="modal"><div class="dialog"><div class="actions"><strong id="modalTitle"></strong><button class="close" id="close">關閉 ✕</button></div><div class="player" id="player"></div><p id="modalInfo" class="small"></p><div id="links"></div></div></div><script>
const topics=['全部','AI','程式設計','創業','科學','科技','演講'];
let items=[], selected='全部', sort='count';
const $=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validId=id=>/^[A-Za-z0-9_-]{11}$/.test(id);
function renderChips(){
 $('chips').innerHTML=topics.map(t=>`<button class="chip ${selected===t?'active':''}" data-topic="${t}">${t}</button>`).join('');
 document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.topic;renderChips();render()}));
}
function render(){
 const q=$('search').value.trim().toLocaleLowerCase();
 let list=items.filter(v=>(selected==='全部'||v.category===selected)&&`${v.title} ${v.category} ${(v.posts||[]).map(p=>p.title).join(' ')}`.toLocaleLowerCase().includes(q));
 list.sort((a,b)=>sort==='recent'?b.last_seen-a.last_seen:sort==='points'?b.points-a.points:b.count-a.count||b.points-a.points);
 $('count').textContent=`符合條件 ${items.length.toLocaleString()} 部影片 · 顯示 ${list.length.toLocaleString()} 部`;
 $('grid').innerHTML=list.length?list.map(v=>`<article class="card" tabindex="0" role="button" data-id="${v.id}" aria-label="播放 ${safe(v.title)}"><div class="thumb"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="" referrerpolicy="no-referrer"><span class="duration">▶ 播放</span></div><h3>${safe(v.title)}</h3><div class="small">${v.count} 篇 HN 貼文 · ${v.points} 點累計分數<br><span class="tag">${safe(v.category)}</span></div></article>`).join(''):'<div class="empty">目前沒有符合條件的影片。若索引尚未建立，請先執行資料回填。</div>';
 document.querySelectorAll('.card').forEach(e=>{e.onclick=()=>show(e.dataset.id);e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();show(e.dataset.id)}}});
}
function show(id){
 const v=items.find(x=>x.id===id);if(!v||!validId(id))return;
 $('modalTitle').textContent=v.title;
 $('player').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1" title="YouTube 影片" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
 $('modalInfo').textContent=`${v.count} 篇不同 HN 貼文 · 累計 ${v.points} 點 · ${v.category}`;
 $('links').innerHTML=`<p><a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener noreferrer">在 YouTube 開啟</a></p><strong>HN 原始討論</strong><ul>${(v.posts||[]).slice(0,30).map(p=>`<li><a href="https://news.ycombinator.com/item?id=${encodeURIComponent(p.id)}" target="_blank" rel="noopener noreferrer">${safe(p.title||'HN 討論')}</a> · ${Number(p.points)||0} 點</li>`).join('')}</ul>`;
 $('modal').classList.add('open');$('close').focus();
}
function close(){ $('modal').classList.remove('open');$('player').replaceChildren() }
$('close').onclick=close;
$('modal').onclick=e=>{if(e.target===$('modal'))close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
$('search').oninput=render;
$('sort').onchange=e=>{sort=e.target.value;render()};
renderChips();
async function load(){
 try{
  const response=await fetch('/data/videos.json',{cache:'no-cache'});
  if(!response.ok)throw new Error(`HTTP ${response.status}`);
  const payload=await response.json();
  items=(payload.videos||[]).filter(v=>validId(v.id)&&v.count>=2);
  const m=payload.metadata||{};
  const date=m.generated_at?new Date(m.generated_at).toLocaleString('zh-TW'):'尚未產生';
  $('status').textContent=m.backfill_complete?`歷史索引已回填 · 更新：${date}`:`歷史索引尚未完成 · 更新：${date}`;
  render();
 }catch(err){$('status').textContent='資料載入失敗：'+err.message;$('count').textContent='無法載入索引'}
}
load();
</script></body></html>
