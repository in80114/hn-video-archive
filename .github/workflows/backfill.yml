
name: Backfill HN history (resumable)

on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'

permissions:
  contents: write

concurrency:
  group: hn-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Backfill historical data
        run: python scripts/index_hn.py --mode backfill --max-windows 24

      - name: Save progress
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Backfill HN historical index'
            git push
          fi
