name: Update HN video index
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python scripts/index_hn.py --mode recent --days 4
      - name: Generate SEO video pages and sitemap
        run: python scripts/build_seo.py
      - name: Commit refreshed index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ video/ sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh HN video index'
            git push
          fi
